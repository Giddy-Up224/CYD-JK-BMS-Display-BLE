; CYD JK BMS Display: ESP-IDF + LVGL 9 on the Cheap Yellow Display
; (ESP32-2432S028R), showing a JK BMS or JK active balancer over Bluetooth LE.
;
; Build/upload:  pio run -t upload --upload-port COM42
; ESP-IDF settings are in sdkconfig.defaults; components (LVGL, the ILI9341
; driver) are fetched by the component manager (src/idf_component.yml).

[env:cyd]
; 6.9.0 = ESP-IDF 5.3.1. Newer platforms (6.13.0 = ESP-IDF 5.5.3) break BLE
; connections on the ESP32: every link to a JK device dropped with a
; supervision timeout (0x208) about 4 s after connecting, while scanning
; worked. Same board, same devices, 5.3.1 streams fine.
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    log2file

; Test build: BLE and console only, display and backlight off. For telling
; radio problems apart from display/power ones.
[env:cyd_nodisplay]
extends = env:cyd
build_flags = -DNO_DISPLAY
